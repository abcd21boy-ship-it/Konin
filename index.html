<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konin</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: linear-gradient(rgba(16,26,18,0.30), rgba(16,26,18,0.50)), url("images/konin-bg.jpg") center / cover no-repeat fixed, #101a12; color: #eef5ee; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 24px; margin: 8px 0 4px; text-align: center; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }
  .sub { text-align: center; color: #d6e8d6; font-size: 14px; margin: 0 0 20px; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }
  .controls { display: flex; gap: 10px; align-items: center; justify-content: center; margin-bottom: 18px; flex-wrap: wrap; }
  .controls label { font-size: 14px; color: #cfe0cf; display: flex; gap: 6px; align-items: center; }
  .stop { background: #b23b3b; color: #fff; border: none; border-radius: 999px; padding: 10px 22px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .track { display: flex; align-items: center; gap: 12px; background: #1c2b1f; border: 1px solid #2c422f; border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .track.playing { border-color: #7bc47f; background: #223626; }
  .play { flex: none; width: 52px; height: 52px; border-radius: 50%; border: none; background: #4caf50; color: #fff; font-size: 22px; cursor: pointer; }
  .sec-konin .play { background: #d32f2f; }
  .sec-pikat .play { background: #f9a825; color: #222; }
  .sec-pemikat .play { background: #43a047; }
  .sec-isian .play { background: #1976d2; }
  .name { flex: 1; font-size: 16px; font-weight: 600; line-height: 1.3; }
  .name small { display: block; font-weight: 400; font-size: 13px; color: #9db89d; }
  .now { text-align: center; color: #7bc47f; font-size: 14px; min-height: 20px; margin: 4px 0 14px; }
  .tabs { display: flex; gap: 8px; margin: 0 0 16px; }
  .tab { flex: 1; background: #1c2b1f; color: #cfe0cf; border: 1px solid #2c422f; border-radius: 12px; padding: 11px 6px; font-size: 14px; font-weight: 600; cursor: pointer; opacity: 0.55; }
  .tab.active { opacity: 1; border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,0.35); }
  .tab-konin { background: #d32f2f; color: #fff; }
  .tab-pikat { background: #f9a825; color: #222; }
  .tab-pemikat { background: #43a047; color: #fff; }
  .tab-isian { background: #1976d2; color: #fff; }
  .credit { text-align: center; color: #7d927d; font-size: 12px; margin-top: 24px; line-height: 1.6; }
  .credit a { color: #9db89d; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Konin</h1>
  <p class="sub">Suara kolibri ninja — 32 lagu: suara konin, pikat konin, pemikat &amp; isian. Tiap lagu 10 menit, bisa diulang terus — ketuk ▶ untuk memutar</p>

  <div class="controls">
    <button class="stop" id="stopAll">■ Berhenti Semua</button>
    <label><input type="checkbox" id="loopAll"> Ulangi terus</label>
    <label>Volume <input type="range" id="vol" min="0" max="100" value="100"></label>
  </div>
  <div class="now" id="nowPlaying"></div>

  <div class="tabs">
    <button class="tab tab-konin active" data-sec="Suara Konin">Suara Konin</button>
    <button class="tab tab-pikat" data-sec="Pikat Konin">Pikat Konin</button>
    <button class="tab tab-pemikat" data-sec="Pemikat">Pemikat</button>
    <button class="tab tab-isian" data-sec="Isian">Isian</button>
  </div>

  <div id="list"></div>

  <p class="credit">Rekaman asli alam liar via xeno-canto.org · Foto: Wikimedia Commons (CC BY-SA)</p>
</div>

<audio id="player" preload="none"></audio>

<script>
var tracks = [
  { sec: "Suara Konin", file: "audio/konin-call-song-vietnam-10menit.mp3", name: "Call & Song — Vietnam", desc: "Konin call dan song dari Taman Nasional Bach Ma, Vietnam" },
  { sec: "Suara Konin", file: "audio/konin-song-cina-10menit.mp3", name: "Call & Song — Cina", desc: "Konin call dan song dari Cina" },
  { sec: "Suara Konin", file: "audio/konin-song-hongkong-10menit.mp3", name: "Song — Hong Kong", desc: "Konin song dari Pak Sha O, Hong Kong" },
  { sec: "Suara Konin", file: "audio/konin-song-nankunshan-10menit.mp3", name: "Song — Nan Kun Shan", desc: "Konin song dari Nan Kun Shan, Guangdong, Cina" },
  { sec: "Suara Konin", file: "audio/konin-song-hainan-10menit.mp3", name: "Song — Hainan", desc: "Konin song dari Jianfengling, Hainan, Cina" },
  { sec: "Suara Konin", file: "audio/konin-song-nonggang-10menit.mp3", name: "Song & Call — Nonggang", desc: "Konin song dan call dari Nonggang, Guangxi, Cina" },
  { sec: "Pikat Konin", file: "audio/konin-call-laos-10menit.mp3", name: "Call — Laos", desc: "Pikat konin, call dari hutan Ban Na Pe, Laos" },
  { sec: "Pikat Konin", file: "audio/konin-call-laos2-10menit.mp3", name: "Call — Laos 2", desc: "Pikat konin, call dari hutan Ban Na Pe, Laos" },
  { sec: "Pikat Konin", file: "audio/konin-call-cina-10menit.mp3", name: "Call — Cina", desc: "Pikat konin, call dari Emei Feng, Cina" },
  { sec: "Pikat Konin", file: "audio/konin-call-cina2-10menit.mp3", name: "Call — Cina 2", desc: "Pikat konin, call dari Cina" },
  { sec: "Pikat Konin", file: "audio/konin-call-hongkong-10menit.mp3", name: "Call — Hong Kong", desc: "Pikat konin, call dari Pak Sha O, Hong Kong" },
  { sec: "Pikat Konin", file: "audio/konin-call-hongkong2-10menit.mp3", name: "Call — Hong Kong 2", desc: "Pikat konin, call dari Pak Sha O, Hong Kong" },
  { sec: "Pikat Konin", file: "audio/konin-call-shenzhen-10menit.mp3", name: "Call — Shenzhen", desc: "Pikat konin, call dari Shenzhen, Cina" },
  { sec: "Pikat Konin", file: "audio/konin-call-laos3-10menit.mp3", name: "Call — Laos 3", desc: "Pikat konin, call dari hutan Ban Na Pe, Laos" },
  { sec: "Pemikat", file: "audio/sogon-10menit.mp3", name: "Pikat Sogon", desc: "Song sogon untuk memikat burung kecil" },
  { sec: "Pemikat", file: "audio/pleci-10menit.mp3", name: "Pikat Pleci", desc: "Panggilan pleci pagi hari" },
  { sec: "Pemikat", file: "audio/ciblek-prenjak-10menit.mp3", name: "Pikat Ciblek / Prenjak", desc: "Song ciblek prenjak dari Indonesia" },
  { sec: "Pemikat", file: "audio/pikat-kenari-10menit.mp3", name: "Pikat Kenari", desc: "Pikat kenari" },
  { sec: "Pemikat", file: "audio/pikat-perkutut-10menit.mp3", name: "Pikat Perkutut", desc: "Pikat perkutut" },
  { sec: "Pemikat", file: "audio/pikat-gereja-10menit.mp3", name: "Pikat Gereja", desc: "Pikat gereja" },
  { sec: "Pemikat", file: "audio/pikat-trucukan-10menit.mp3", name: "Pikat Trucukan", desc: "Pikat trucukan" },
  { sec: "Pemikat", file: "audio/pikat-kutilang-10menit.mp3", name: "Pikat Kutilang", desc: "Pikat kutilang" },
  { sec: "Pemikat", file: "audio/pikat-prenjak-10menit.mp3", name: "Pikat Prenjak", desc: "Pikat prenjak" },
  { sec: "Isian", file: "audio/kapas-tembak-10menit.mp3", name: "Kapas Tembak", desc: "Isian kapas tembak untuk konin" },
  { sec: "Isian", file: "audio/isian-cililin-10menit.mp3", name: "Cililin", desc: "Isian cililin untuk konin" },
  { sec: "Isian", file: "audio/isian-kenari-10menit.mp3", name: "Kenari", desc: "Isian kenari untuk konin" },
  { sec: "Isian", file: "audio/isian-lovebird-10menit.mp3", name: "Lovebird Ngekek", desc: "Isian lovebird ngekek untuk konin" },
  { sec: "Isian", file: "audio/isian-cucak-jenggot-10menit.mp3", name: "Cucak Jenggot", desc: "Isian cucak jenggot untuk konin" },
  { sec: "Isian", file: "audio/isian-tengkek-buto-10menit.mp3", name: "Tengkek Buto", desc: "Isian tengkek buto untuk konin" },
  { sec: "Isian", file: "audio/isian-gereja-tarung-10menit.mp3", name: "Gereja Tarung", desc: "Isian gereja tarung untuk konin" },
  { sec: "Isian", file: "audio/isian-ciblek-kristal-10menit.mp3", name: "Ciblek Kristal", desc: "Isian ciblek kristal untuk konin" },
  { sec: "Isian", file: "audio/isian-srindit-10menit.mp3", name: "Srindit", desc: "Isian srindit untuk konin" }
];
var player = document.getElementById("player");
var list = document.getElementById("list");
var nowEl = document.getElementById("nowPlaying");
var current = -1;
var activeSec = "Suara Konin";

function secClass(sec) {
  if (sec === "Suara Konin") return "sec-konin";
  if (sec === "Pikat Konin") return "sec-pikat";
  if (sec === "Pemikat") return "sec-pemikat";
  return "sec-isian";
}

function render() {
  list.innerHTML = "";
  list.className = secClass(activeSec);
  var n = 0;
  tracks.forEach(function (t, i) {
    if (t.sec !== activeSec) return;
    n++;
    var row = document.createElement("div");
    row.className = "track" + (i === current && !player.paused ? " playing" : "");
    var btn = document.createElement("button");
    btn.className = "play";
    btn.textContent = (i === current && !player.paused) ? "⏸" : "▶";
    btn.setAttribute("aria-label", "Putar " + t.name);
    btn.onclick = function () { toggle(i); };
    var nm = document.createElement("div");
    nm.className = "name";
    var title = document.createElement("span");
    title.textContent = n + ". " + t.name;
    var small = document.createElement("small");
    small.textContent = t.desc;
    nm.appendChild(title);
    nm.appendChild(small);
    row.appendChild(btn);
    row.appendChild(nm);
    list.appendChild(row);
  });
}

function toggle(i) {
  if (current === i && !player.paused) {
    player.pause();
  } else {
    if (current !== i) {
      player.src = tracks[i].file;
      current = i;
    }
    player.play();
  }
  render();
}

player.addEventListener("play", function () {
  nowEl.textContent = current >= 0 ? "▶ Memutar: " + tracks[current].name : "";
  render();
});
player.addEventListener("pause", function () {
  nowEl.textContent = "";
  render();
});
player.addEventListener("ended", function () {
  nowEl.textContent = "";
  render();
});

document.getElementById("stopAll").onclick = function () {
  player.pause();
  player.currentTime = 0;
  current = -1;
  nowEl.textContent = "";
  render();
};
document.getElementById("loopAll").onchange = function (e) {
  player.loop = e.target.checked;
};
document.getElementById("vol").oninput = function (e) {
  player.volume = e.target.value / 100;
};

document.querySelectorAll(".tab").forEach(function (b) {
  b.onclick = function () {
    document.querySelectorAll(".tab").forEach(function (x) { x.classList.remove("active"); });
    b.classList.add("active");
    activeSec = b.getAttribute("data-sec");
    render();
  };
});

render();
</script>
</body>
</html>
